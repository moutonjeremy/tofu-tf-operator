name: Release

# Pushing a tag such as v0.1.0 publishes:
# - the multi-arch images ghcr.io/<owner>/tofu-tf-operator and ghcr.io/<owner>/tofu-runner;
# - the Helm chart oci://ghcr.io/<owner>/charts/tofu-tf-operator;
# - a GitHub release with install.yaml, the kubectl-tofu archives and their checksums.
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  images:
    name: Build and push the images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Compute the version and the registry
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Labels of the runner image
        id: runner-labels
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.meta.outputs.registry }}/tofu-runner
          tags: type=semver,pattern={{version}}

      - name: Build and push the runner image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.runner
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.runner-labels.outputs.tags }}
          labels: ${{ steps.runner-labels.outputs.labels }}

      - name: Labels of the manager image
        id: manager-labels
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.meta.outputs.registry }}/tofu-tf-operator
          tags: type=semver,pattern={{version}}

      - name: Build and push the manager image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # The manager runs by default the runner of its own release.
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            RUNNER_IMAGE=${{ steps.meta.outputs.registry }}/tofu-runner:${{ steps.meta.outputs.version }}
          tags: ${{ steps.manager-labels.outputs.tags }}
          labels: ${{ steps.manager-labels.outputs.labels }}

  release:
    name: Publish the chart and the release
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Build the release assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          make release-artifacts VERSION="$version" IMG="$registry/tofu-tf-operator:$version"

      - name: Push the Helm chart
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "$REGISTRY_PASSWORD" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm push "dist/release/tofu-tf-operator-$version.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/release/* --verify-tag --generate-notes $prerelease
