apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: tofu-tf-operator
    control-plane: controller-manager
  name: tofu-tf-operator-controller-manager-receiver
  namespace: tofu-tf-operator-system
spec:
  ports:
  - name: receiver
    port: 80
    protocol: TCP
    targetPort: receiver
