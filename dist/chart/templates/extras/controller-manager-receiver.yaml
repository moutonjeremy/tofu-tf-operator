apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "tofu-tf-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    control-plane: controller-manager
  name: {{ include "tofu-tf-operator.resourceName" (dict "suffix" "controller-manager-receiver" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - name: receiver
    port: 80
    protocol: TCP
    targetPort: receiver
  selector:
    app.kubernetes.io/name: {{ include "tofu-tf-operator.name" . }}
    control-plane: controller-manager
