{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: notificationproviders.infra.labbs.fr
spec:
  group: infra.labbs.fr
  names:
    categories:
    - tofu
    kind: NotificationProvider
    listKind: NotificationProviderList
    plural: notificationproviders
    singular: notificationprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.suspend
      name: Suspended
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NotificationProvider is an endpoint receiving the events of Workspaces.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of NotificationProvider
            properties:
              address:
                description: |-
                  address is the URL events are sent to.
                  Use secretRef instead when the URL contains a token.
                pattern: ^https?://
                type: string
              secretRef:
                description: |-
                  secretRef references a Secret with optional keys:
                  `address` (overrides address) and `token` (sent as `Authorization: Bearer <token>`).
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              suspend:
                description: suspend stops sending events.
                type: boolean
              timeout:
                default: 15s
                description: timeout of each request.
                type: string
              type:
                default: webhook
                description: |-
                  type of the provider.
                  webhook posts the event as JSON to the address.
                enum:
                - webhook
                type: string
            type: object
            x-kubernetes-validations:
            - message: one of address or secretRef must be set
              rule: has(self.address) || has(self.secretRef)
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
{{- end }}
