apiVersion: v1
kind: Service
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: tofu-tf-operator
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager-receiver
  namespace: system
spec:
  # Expose it with an Ingress or a Gateway to receive the webhooks of GitHub or GitLab.
  ports:
  - name: receiver
    port: 80
    protocol: TCP
    targetPort: receiver
  selector:
    control-plane: controller-manager
    app.kubernetes.io/name: tofu-tf-operator
